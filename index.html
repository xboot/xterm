<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090b0d" />
    <meta
      name="description"
      content="XBOOT Web Serial Terminal — 在浏览器中安全连接、调试和记录串口设备。"
    />
    <title>XTERM · XBOOT Web Serial Terminal</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <a class="brand" href="https://xboot.org" target="_blank" rel="noreferrer" aria-label="XBOOT 官网">
          <span class="brand-mark" aria-hidden="true">X</span>
          <span class="brand-copy"><b>XTERM</b><small>WEB SERIAL CONSOLE</small></span>
        </a>

        <div class="connection-state" id="connection-state" role="status">
          <span class="state-dot"></span>
          <span id="state-text">未连接</span>
        </div>

        <div class="top-actions">
          <button class="icon-button mobile-only" id="toggle-settings" type="button" aria-label="打开串口设置">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2m4 0h10M14 4v6M7 14v6" /></svg>
          </button>
          <button class="icon-button language-button" id="toggle-language" type="button" aria-label="Switch to English">EN</button>
          <button class="icon-button theme-button" id="toggle-theme" type="button" aria-label="切换为浅色主题">
            <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
            <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.2A9 9 0 0 1 8.8 3.5 9 9 0 1 0 20.5 15.2Z" /></svg>
          </button>
          <a class="icon-button" href="https://github.com/xboot/xterm" target="_blank" rel="noreferrer" aria-label="GitHub 仓库">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3.3-.4 6.8-1.6 6.8-7A5.4 5.4 0 0 0 19.4 4 5 5 0 0 0 19.3.5S18.2.1 15 1.8a13.4 13.4 0 0 0-7 0C4.8.1 3.7.5 3.7.5A5 5 0 0 0 3.6 4a5.4 5.4 0 0 0-1.4 3.7c0 5.3 3.5 6.5 6.8 7A4.8 4.8 0 0 0 8 18v4M8 19c-3 .9-3-1.5-4-2" /></svg>
          </a>
        </div>
      </header>

      <main class="workspace">
        <aside class="settings-panel" id="settings-panel">
          <div class="panel-heading">
            <div><span class="eyebrow">SERIAL PORT</span><h1 data-i18n="settingsTitle">连接配置</h1></div>
            <button class="icon-button panel-close" id="close-settings" type="button" aria-label="关闭设置">×</button>
          </div>

          <div class="field-group">
            <label for="baud-rate" data-i18n="baudRate">波特率</label>
            <div class="baud-control">
              <select id="baud-rate">
                <option value="300">300</option><option value="600">600</option>
                <option value="1200">1200</option><option value="2400">2400</option><option value="4800">4800</option>
                <option value="9600">9600</option><option value="19200">19200</option><option value="38400">38400</option>
                <option value="57600">57600</option><option value="74880">74880</option><option value="115200" selected>115200</option>
                <option value="230400">230400</option><option value="460800">460800</option><option value="921600">921600</option>
                <option value="1000000">1000000</option><option value="1500000">1500000</option>
                <option value="2000000">2000000</option><option value="3000000">3000000</option>
                <option value="custom" data-i18n="customBaudRate">自定义…</option>
              </select>
              <input id="custom-baud-rate" type="number" min="1" max="20000000" step="1" value="115200" inputmode="numeric" hidden />
            </div>
          </div>

          <div class="field-row">
            <div class="field-group"><label for="data-bits" data-i18n="dataBits">数据位</label><select id="data-bits"><option>7</option><option selected>8</option></select></div>
            <div class="field-group"><label for="stop-bits" data-i18n="stopBits">停止位</label><select id="stop-bits"><option selected>1</option><option>2</option></select></div>
          </div>

          <div class="field-group"><label for="parity" data-i18n="parity">校验位</label><select id="parity"><option value="none" data-i18n="none">无</option><option value="even" data-i18n="evenParity">偶校验</option><option value="odd" data-i18n="oddParity">奇校验</option></select></div>
          <div class="field-group"><label for="flow-control" data-i18n="flowControl">流控制</label><select id="flow-control"><option value="none" data-i18n="none">无</option><option value="hardware" data-i18n="hardwareFlow">硬件流控</option></select></div>

          <button class="connect-button" id="connect-button" type="button"><span class="button-symbol">↗</span><span data-i18n="connect">连接串口</span></button>

          <div class="divider"></div>

          <div class="option-row"><span><b data-i18n="lineEnding">回车发送</b><small data-i18n="lineEndingHint">设置 Enter 键发送的行尾符</small></span><select class="option-select" id="line-ending" aria-label="回车发送"><option value="cr">CR</option><option value="lf">LF</option><option value="crlf">CRLF</option></select></div>
          <div class="option-row"><span><b data-i18n="autoScroll">自动滚动</b><small data-i18n="autoScrollHint">始终跟随最新输出</small></span><label class="switch"><input id="auto-scroll" type="checkbox" checked /><span></span></label></div>
          <div class="option-row"><span><b data-i18n="timestamps">时间戳</b><small data-i18n="timestampsHint">在每个接收行的行首显示</small></span><label class="switch"><input id="timestamps" type="checkbox" /><span></span></label></div>

          <div class="secure-note">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" /><path d="m9 12 2 2 4-4" /></svg>
            <p><b data-i18n="privacyTitle">数据仅在本机流转</b><br /><span data-i18n="privacyHint">浏览器不会将串口数据上传到服务器。</span></p>
          </div>
        </aside>

        <section class="terminal-shell">
          <div class="terminal-toolbar">
            <div class="terminal-title"><span class="terminal-icon">›_</span><span>Terminal</span><span class="port-label" id="port-label">等待设备</span></div>
            <div class="terminal-actions">
              <button type="button" id="clear-terminal" title="清空终端">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m3 0-1 15H6L5 6m4 4v7m6-7v7" /></svg><span data-i18n="clear">清空</span>
              </button>
              <button type="button" id="download-log" title="下载日志">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 21h14" /></svg><span data-i18n="log">日志</span>
              </button>
            </div>
          </div>

          <div class="terminal-stage" id="terminal-stage">
            <div id="terminal"></div>
            <div class="empty-state" id="empty-state">
              <div class="plug-orbit"><span class="plug">⌁</span></div>
              <h2 data-i18n="readyTitle">准备连接串口设备</h2>
              <p data-i18n="readyHint">设置通信参数，然后点击“连接串口”开始。</p>
              <button type="button" id="empty-connect" data-i18n="chooseDevice">选择串口设备</button>
              <small data-i18n="browserHint">需要 Chrome、Edge 或其他支持 Web Serial 的 Chromium 浏览器</small>
            </div>
          </div>

          <footer class="statusbar">
            <span><i class="status-led" id="status-led"></i><span id="status-detail">DISCONNECTED</span></span>
            <span class="status-spacer"></span>
            <span>RX <b id="rx-count">0 B</b></span><span>TX <b id="tx-count">0 B</b></span><span id="session-time">00:00:00</span>
          </footer>
        </section>
      </main>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
